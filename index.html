<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Theme: the reader's saved choice, else the device setting. Runs before paint to avoid a flash. -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('mj-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      if (theme === 'dark') root.classList.add('dark');
      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme;
    }());
  </script>

  <!-- Google tag (gtag.js) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;

    window.loadGoogleServices = function () {
      if (window.googleServicesLoaded) {
        return;
      }

      window.googleServicesLoaded = true;
      gtag('js', new Date());

      var analyticsScript = document.createElement('script');
      analyticsScript.async = true;
      analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-GP4QCG7WLR';
      document.head.appendChild(analyticsScript);

      var adsScript = document.createElement('script');
      adsScript.async = true;
      adsScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2245947957404736';
      adsScript.crossOrigin = 'anonymous';
      document.head.appendChild(adsScript);
    };

    (function () {
      var consentCookie = document.cookie
        .split('; ')
        .find(function (row) {
          return row.indexOf('missjoo_cookie_consent=') === 0;
        });
      var hasAcceptedCookies = consentCookie && decodeURIComponent(consentCookie.split('=').slice(1).join('=')) === 'accepted';
      var consentStatus = hasAcceptedCookies ? 'granted' : 'denied';

      gtag('consent', 'default', {
        analytics_storage: consentStatus,
        ad_storage: consentStatus,
        ad_user_data: consentStatus,
        ad_personalization: consentStatus
      });

      if (hasAcceptedCookies) {
        window.loadGoogleServices();
      }
    }());
  </script>
  <meta name="google-adsense-account" content="ca-pub-2245947957404736">
  <meta name="author" content="Miss Joo" />

  <!-- Per-page title, description, canonical, Open Graph, Twitter and JSON-LD.
       Filled in at build time by scripts/prerender.mjs and kept in sync by HeadManager. -->
  <!--seo-head-->

  <!-- Favicon -->
  <link rel="shortcut icon" href="/favicon.ico?v=4">
  <link rel="icon" href="/miss-joo-favicon.ico?v=4" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=4">
  <link rel="icon" type="image/png" sizes="512x512" href="/miss-joo-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fonts load without blocking the first paint (font-display: swap) -->
  <link rel="preload" as="style" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" /></noscript>

  <!-- Single Page Apps for GitHub Pages - redirect handler -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
